# Exemplo: mesmo host para Angular (SPA) e API Node.
# Ajuste server_name, root e upstream conforme o servidor.

upstream ecommerce_node {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name loja.seudominio.com;

    # ssl_certificate     /path/fullchain.pem;
    # ssl_certificate_key /path/privkey.pem;

    root /var/www/ecommerce/browser;
    index index.html;

    # API Node — mesmas regras do proxy.conf.mjs em dev
    location ~ ^/(auth|catalog|cart)/ {
        proxy_pass http://ecommerce_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Angular: vitrine, /auth/login (GET), /redefinir-senha?token=..., etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
