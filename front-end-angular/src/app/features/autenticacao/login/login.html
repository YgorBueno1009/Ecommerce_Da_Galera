<section class="acesso" aria-labelledby="login-titulo">
  <header class="acesso__cabecalho">
    <h1 id="login-titulo">Entrar</h1>
  </header>

  <form class="acesso__formulario" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <div class="acesso__campo" [class.acesso__campo--invalido]="campoInvalido('email')">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="seu@email.com"
        [attr.aria-invalid]="campoInvalido('email')"
        aria-describedby="email-erro"
      />
      @if (campoInvalido('email')) {
        <small id="email-erro">Informe um e-mail válido.</small>
      }
    </div>

    <div class="acesso__campo" [class.acesso__campo--invalido]="campoInvalido('password')">
      <div class="acesso__campo-topo">
        <label for="senha">Senha</label>
        <a class="acesso__link" routerLink="/auth/forgot">Esqueci a senha</a>
      </div>
      <div class="acesso__senha">
        <input
          id="senha"
          [type]="senhaVisivel() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          maxlength="72"
          [attr.aria-invalid]="campoInvalido('password')"
          aria-describedby="senha-erro"
        />
        <button
          class="acesso__mostrar-senha"
          type="button"
          [attr.aria-label]="senhaVisivel() ? 'Ocultar senha' : 'Mostrar senha'"
          [attr.aria-pressed]="senhaVisivel()"
          (click)="senhaVisivel.set(!senhaVisivel())"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
            @if (senhaVisivel()) {
              <path d="m3 3 18 18" />
            }
          </svg>
        </button>
      </div>
      @if (campoInvalido('password')) {
        <small id="senha-erro">Informe sua senha.</small>
      }
    </div>

    @if (erro()) {
      <p class="acesso__caixa acesso__caixa--erro" role="alert">{{ erro() }}</p>
    }

    <button class="acesso__botao" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <p class="acesso__rodape">
    Novo por aqui? <a class="acesso__link" routerLink="/auth/register">Criar conta</a>
  </p>
</section>
